<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHACHA ELECTRON</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f7fa;
}

header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:20px;
position:sticky;
top:0;
z-index:100;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.cart-badge{
background:white;
color:black;
padding:10px 15px;
border-radius:30px;
font-weight:bold;
}

.search{
padding:20px;
background:white;
}

.search input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
}

.categories{
display:flex;
gap:10px;
padding:15px;
overflow:auto;
background:white;
}

.categories button{
padding:10px 15px;
border:none;
border-radius:30px;
background:#2563eb;
color:white;
cursor:pointer;
}

.products{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
margin:10px 0;
}

button{
padding:10px 15px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
}

.cart{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
}

.cart ul{
padding-left:20px;
}

.remove{
background:red;
margin-left:10px;
}

.checkout{
margin-top:15px;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:30px;
margin-top:20px;
}

footer a{
color:#25D366;
text-decoration:none;
margin:5px;
}

</style>
</head>
<body>

<header>

<div class="topbar">

<div class="logo">
⚡ CHACHA ELECTRON
</div>

<div class="cart-badge">
🛒 <span id="cartCount">0</span>
</div>

</div>

</header>

<div class="search">

<input
id="search"
placeholder="Search products..."
onkeyup="searchProducts()">

</div>

<div class="categories">

<button onclick="filterCategory('all')">
All
</button>

<button onclick="filterCategory('Smartphones')">
Phones
</button>

<button onclick="filterCategory('Laptops')">
Laptops
</button>

<button onclick="filterCategory('TVs')">
TVs
</button>

<button onclick="filterCategory('Headphones')">
Headphones
</button>

<button onclick="filterCategory('Electrical Cables')">
Cables
</button>

</div>

<div class="products" id="products"></div>

<div class="cart">

<h2>Shopping Cart</h2>

<ul id="cartItems"></ul>

<h2>
Total:
KES <span id="total">0</span>
</h2>

<div class="checkout">

<button onclick="checkout()">
PAY WITH M-PESA
</button>

</div>

</div>

<footer>

<h2>CHACHA ELECTRON</h2>

<p>M-Pesa Number: 0799446312</p>

<a href="tel:0799446312">
📞 Call
</a>

<a href="sms:0799446312">
📩 SMS
</a>

<a href="https://wa.me/254799446312">
💬 WhatsApp
</a>

</footer>

<script>

const products = [

{
name:"Samsung Galaxy S24 Ultra",
category:"Smartphones",
price:185000,
image:"images/phones/phone1.jpg"
},

{
name:"iPhone 15 Pro Max",
category:"Smartphones",
price:215000,
image:"images/phones/phone2.jpg"
},

{
name:"Tecno Camon 30",
category:"Smartphones",
price:28000,
image:"images/phones/phone3.jpg"
},

{
name:"HP EliteBook 840 G8",
category:"Laptops",
price:95000,
image:"images/laptops/laptop1.jpg"
},

{
name:"Dell Latitude 7420",
category:"Laptops",
price:105000,
image:"images/laptops/laptop2.jpg"
},

{
name:"Lenovo ThinkPad",
category:"Laptops",
price:98000,
image:"images/laptops/laptop3.jpg"
},

{
name:"Samsung 55 Smart TV",
category:"TVs",
price:92000,
image:"images/tvs/tv1.jpg"
},

{
name:"LG OLED 65 TV",
category:"TVs",
price:165000,
image:"images/tvs/tv2.jpg"
},

{
name:"Hisense 43 Smart TV",
category:"TVs",
price:38000,
image:"images/tvs/tv3.jpg"
},

{
name:"Sony WH1000XM5",
category:"Headphones",
price:45000,
image:"images/headphones/headphone1.jpg"
},

{
name:"JBL Tune 770NC",
category:"Headphones",
price:12000,
image:"images/headphones/headphone2.jpg"
},

{
name:"HDMI Cable 5M",
category:"Electrical Cables",
price:1200,
image:"images/cables/cable1.jpg"
},

{
name:"CAT6 Network Cable",
category:"Electrical Cables",
price:2500,
image:"images/cables/cable2.jpg"
}

];

let cart = [];
let total = 0;

function renderProducts(items){

const container =
document.getElementById("products");

container.innerHTML = "";

items.forEach(product=>{

container.innerHTML += `

<div class="product">

<img
src="${product.image}"
alt="${product.name}"
onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">

<div class="info">

<h3>${product.name}</h3>

<p>${product.category}</p>

<div class="price">
KES ${product.price.toLocaleString()}
</div>

<button
onclick="
addToCart(
'${product.name}',
${product.price}
)
">

Add To Cart

</button>

</div>

</div>

`;

});

}

renderProducts(products);

function searchProducts(){

let search =
document.getElementById("search")
.value
.toLowerCase();

renderProducts(

products.filter(product =>

product.name
.toLowerCase()
.includes(search)

||

product.category
.toLowerCase()
.includes(search)

)

);

}

function filterCategory(category){

if(category==="all"){

renderProducts(products);
return;

}

renderProducts(

products.filter(
p=>p.category===category
)

);

}

function addToCart(name,price){

const item =
cart.find(i=>i.name===name);

if(item){

item.qty++;

}else{

cart.push({

name,
price,
qty:1

});

}

updateCart();

}

function updateCart(){

let html = "";

let count = 0;

total = 0;

cart.forEach((item,index)=>{

count += item.qty;

total += item.price * item.qty;

html += `

<li>

${item.name}

x${item.qty}

-

KES ${(item.price *
item.qty).toLocaleString()}

<button
class="remove"
onclick="removeItem(${index})">

X

</button>

</li>

`;

});

document.getElementById(
"cartCount"
).innerHTML =
count;

document.getElementById(
"cartItems"
).innerHTML =
html;

document.getElementById(
"total"
).innerHTML =
total.toLocaleString();

}

function removeItem(index){

cart.splice(index,1);

updateCart();

}

function checkout(){

if(cart.length===0){

alert("Cart is empty");
return;

}

alert(

"CHACHA ELECTRON\n\n"+
"Total: KES "+
total.toLocaleString()+
"\n\nPay to:\n"+
"0799446312\n\n"+
"Send confirmation via WhatsApp."

);

window.open(
"https://wa.me/254799446312",
"_blank"
);

}

</script>

</body>
</html>
