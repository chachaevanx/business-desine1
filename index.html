<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHACHA ELECTRON</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f7fb;
}

#store{
display:none;
}

.auth{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb,#06b6d4);
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
width:100%;
max-width:550px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.card h1{
text-align:center;
margin-bottom:15px;
color:#2563eb;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.hero{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.cart-counter{
background:white;
color:black;
padding:10px 15px;
border-radius:50px;
}

.search{
padding:20px;
}

.categories{
display:flex;
overflow:auto;
gap:10px;
padding:10px;
}

.categories button{
width:auto;
padding:10px 18px;
border-radius:30px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:180px;
object-fit:cover;
}

.info{
padding:15px;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
margin:10px 0;
}

.cart{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.cart ul{
padding-left:20px;
}

.remove{
background:red;
padding:5px 10px;
margin-left:10px;
width:auto;
}

footer{
background:#0f172a;
color:white;
text-align:center;
padding:30px;
}

footer a{
color:#25D366;
margin:10px;
text-decoration:none;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
text-decoration:none;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

#strength{
font-weight:bold;
}

</style>
</head>

<body>

<div id="auth" class="auth">

<div class="card">

<h1>⚡ CHACHA ELECTRON</h1>

<h3>Create Account</h3>

<input id="fullname" placeholder="Full Names">
<input id="idnumber" placeholder="ID Number">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone Number">

<select id="country">
<option value="">Select Country</option>
<option>Kenya</option>
<option>Uganda</option>
<option>Tanzania</option>
<option>Rwanda</option>
<option>Burundi</option>
<option>Ethiopia</option>
<option>Somalia</option>
<option>South Sudan</option>
<option>Djibouti</option>
<option>Eritrea</option>
</select>

<input id="county" placeholder="County / State">
<input id="town" placeholder="Town / City">

<input type="password" id="password" placeholder="Strong Password">

<div id="strength"></div>

<input type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button onclick="registerUser()">
Register
</button>

<hr style="margin:20px 0;">

<h3>Login</h3>

<input id="loginId" placeholder="ID Number">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button onclick="loginUser()">
Login
</button>

<p
style="margin-top:10px;color:blue;cursor:pointer"
onclick="forgotPassword()">
Forgot Password?
</p>

</div>

</div>

<div id="store">

<div class="hero">

<div class="topbar">

<div class="logo">
⚡ CHACHA ELECTRON
</div>

<div class="cart-counter">
🛒 <span id="cartCount">0</span>
</div>

</div>

</div>

<div class="search">

<input
id="search"
placeholder="Search products..."
onkeyup="searchProducts()">

</div>

<div class="categories" id="categoryButtons"></div>

<div class="products" id="products"></div>

<div class="cart">

<h2>Shopping Cart</h2>

<ul id="cartItems"></ul>

<h2>
Total:
KES <span id="total">0</span>
</h2>

<button onclick="checkout()">
PAY WITH M-PESA
</button>

</div>

<footer>

<h2>CHACHA ELECTRON</h2>

<p>M-Pesa: 0799446312</p>

<a href="tel:0799446312">
📞 Call
</a>

<a href="sms:0799446312">
📩 SMS
</a>

<a href="https://wa.me/254799446312">
💬 WhatsApp
</a>

</footer>

</div>

<a class="whatsapp"
href="https://wa.me/254799446312"
target="_blank">
💬
</a>

<script>

document
.getElementById("password")
.addEventListener("keyup",()=>{

const strong =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

document
.getElementById("strength")
.innerHTML =

strong.test(
document.getElementById("password").value
)

?

"🟢 Strong Password"

:

"🔴 Weak Password";

});

function registerUser(){

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirmPassword").value;

const strong =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

if(!strong.test(password)){

alert("Password not strong enough");
return;

}

if(password!==confirm){

alert("Passwords do not match");
return;

}

localStorage.setItem(
"id",
document.getElementById("idnumber").value
);

localStorage.setItem(
"password",
password
);

alert("Account Created");

}

function loginUser(){

if(
document.getElementById("loginId").value
===
localStorage.getItem("id")

&&

document.getElementById("loginPassword").value
===
localStorage.getItem("password")
){

document.getElementById("auth").style.display="none";
document.getElementById("store").style.display="block";

}else{

alert("Invalid Login");

}

}

function forgotPassword(){

const pass =
prompt("Enter New Password");

if(pass){

localStorage.setItem("password",pass);

alert("Password Updated");

}

}

const products=[];

const categories=[

"Smartphones",
"Laptops",
"TVs",
"Tablets",
"Smart Watches",

"Headphones",
"Earphones",
"Bluetooth Speakers",

"Electrical Cables",
"Electrical Accessories",

"Networking",
"CCTV",
"Gaming",

"Solar Products",
"Home Appliances",

"Computer Components",

"Phone Spare Parts",
"Laptop Spare Parts",
"TV Spare Parts",

"Power Tools"

];

categories.forEach(category=>{

for(let i=1;i<=50;i++){

products.push({

name:
`${category} Product ${i}`,

category,

brand:[
"Samsung",
"Apple",
"HP",
"Dell",
"Sony",
"LG",
"Lenovo",
"Huawei"
][i%8],

price:
1000+(i*500),

image:
`https://via.placeholder.com/300x200?text=${encodeURIComponent(category)}`

});

}

});

let categoriesHTML=
`<button onclick="filterCategory('all')">All</button>`;

categories.forEach(c=>{

categoriesHTML +=
`<button onclick="filterCategory('${c}')">${c}</button>`;

});

document.getElementById(
"categoryButtons"
).innerHTML =
categoriesHTML;

function renderProducts(list){

let html='';

list.forEach(p=>{

html += `

<div class="product">

<img src="${p.image}">

<div class="info">

<h3>${p.name}</h3>

<p>${p.brand}</p>

<p>⭐⭐⭐⭐⭐</p>

<div class="price">
KES ${p.price.toLocaleString()}
</div>

<button
onclick="addToCart(
'${p.name}',
${p.price}
)">
Add To Cart
</button>

</div>

</div>

`;

});

document.getElementById("products")
.innerHTML=html;

}

renderProducts(products);

function searchProducts(){

const text=
document
.getElementById("search")
.value
.toLowerCase();

const filtered=
products.filter(

p=>

p.name.toLowerCase()
.includes(text)

||

p.category.toLowerCase()
.includes(text)

||

p.brand.toLowerCase()
.includes(text)

);

renderProducts(filtered);

}

function filterCategory(cat){

if(cat==="all"){

renderProducts(products);
return;

}

renderProducts(

products.filter(
p=>p.category===cat
)

);

}

let cart=[];
let total=0;

function addToCart(name,price){

const item=
cart.find(
i=>i.name===name
);

if(item){

item.qty++;

}else{

cart.push({
name,
price,
qty:1
});

}

updateCart();

}

function updateCart(){

let html='';

let count=0;

total=0;

cart.forEach((item,index)=>{

count += item.qty;

total += item.price*item.qty;

html += `

<li>

${item.name}

x${item.qty}

-

KES ${(item.qty*item.price)
.toLocaleString()}

<button
class="remove"
onclick="removeItem(${index})">

X

</button>

</li>

`;

});

document
.getElementById("cartItems")
.innerHTML=html;

document
.getElementById("total")
.innerHTML=
total.toLocaleString();

document
.getElementById("cartCount")
.innerHTML=count;

}

function removeItem(index){

cart.splice(index,1);

updateCart();

}

function checkout(){

if(cart.length===0){

alert("Cart is Empty");
return;

}

alert(

"CHACHA ELECTRON\n\n"+

"TOTAL: KES "+

total.toLocaleString()+

"\n\nPay Via M-Pesa\n"+
"0799446312\n\n"+
"Then send payment confirmation on WhatsApp."

);

window.open(

"https://wa.me/254799446312?text="+

encodeURIComponent(

"Hello CHACHA ELECTRON, I have made payment for my order totaling KES "+total

)

);

}

</script>

</body>
</html>
